- title: Ewald summation with prolates (ESP)
  summary: Prolate spheroidal wave functions let us use coarser Fourier grids at the same force accuracy, reducing the cost
    of long-range electrostatics in large molecular dynamics simulations.
  journal: Nature Communications
  year: 2026
  doi: https://doi.org/10.1038/s41467-026-73232-8
  figures:
  - image: esp-fig2.png
    caption: 'ESP scaling in LAMMPS: up to 7.7× faster at 106 million atoms'
- title: Machine-learning interatomic potentials for long-range systems (SOG-Net)
  summary: SOG-Net couples a local potential to a learned sum-of-Gaussians kernel, capturing long-range interactions in molecular
    and condensed-phase systems.
  journal: Physical Review Letters
  year: 2025
  doi: https://doi.org/10.1103/ssp9-7s81
  figures:
  - image: sog-v3.png
    caption: Schematic of the SOG-Net architecture
  note: Editors’ Suggestion
- title: Spectral electrostatics in quasi-2D systems
  summary: We develop a spectrally accurate sum-of-Gaussians solver for systems that are periodic in two directions and open
    in the third. It combines Fourier methods with polynomial interpolation to evaluate long-range interactions without zero
    padding in the open direction.
  journal: Numerische Mathematik
  year: 2026
  doi: https://doi.org/10.1007/s00211-025-01518-y
  figures:
  - image: jctc-slab.png
    published_doi: https://doi.org/10.1021/acs.jctc.5c00438
    caption: Quasi-2D slab with dielectric interfaces
  - image: quasi-convergence-5d.png
    caption: Long-range error vs. Chebyshev order
- title: Fast Monte Carlo for periodic Coulomb systems (DMK-MC)
  summary: Dual-space multilevel kernel splitting brings the expected cost of a trial move down to logarithmic in particle
    count at fixed accuracy.
  journal: SIAM Journal on Scientific Computing
  year: 2026
  doi: https://doi.org/10.1137/26M1841938
  figures:
  - image: dmk-fig2.svg
    caption: 'DMK-MC vs. FMM: trial and accepted-move update times'
- title: Error analysis of the u-series method
  summary: The u-series underlies electrostatics on D. E. Shaw Research’s Anton 2 and Anton 3 supercomputers. We derive energy
    and force error estimates that guide the choice of Gaussian terms and real-space cutoff for a target accuracy.
  journal: Applied and Computational Harmonic Analysis
  year: 2025
  doi: https://doi.org/10.1016/j.acha.2025.101759
  figures:
  - image: useries-fig4.svg
    caption: 'Theoretical predictions closely match the numerical errors'
